<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title><style>
:root{color-scheme:dark;--ink:#edf3ff;--muted:#93a3c0;--line:#a6c0ff30;--blue:#8ab7ff}*{box-sizing:border-box}body{margin:0;background:#050915;color:var(--ink);font:16px/1.7 'Avenir Next','PingFang SC',sans-serif}button,a{color:inherit}button{font:inherit;cursor:pointer}a{text-underline-offset:5px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #9ec6ff;outline-offset:6px}.chrome{position:fixed;top:0;left:0;right:0;height:90px;padding:0 4%;display:flex;align-items:center;justify-content:space-between;z-index:20;background:linear-gradient(#050915dc,transparent);pointer-events:none}.chrome>*{pointer-events:auto}.brand{font-weight:700;letter-spacing:-.6px;text-decoration:none}.brand b{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid #a3bfff70;margin-right:12px}.chrome button{background:none;border:1px solid #9ebaff50;border-radius:30px;padding:8px 18px;font-size:12px}.chrome nav{display:flex;align-items:center;gap:24px;font-size:12px}.view{display:none}.hero-intro{max-width:1200px;margin:130px auto;padding:30px}h1{font-size:80px;letter-spacing:-5px;line-height:1.06}h2{font-size:48px;letter-spacing:-2px;line-height:1.2;margin:25px 0}h3{font-size:24px;font-weight:500}p{color:var(--muted)}.plain-report{max-width:1100px;margin:80px auto;padding:40px}.section-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px;font-size:13px}.status{color:#b3ceff}.summary{font-size:19px;max-width:850px}.meta{font-size:12px;overflow-wrap:anywhere}.demo{font-size:12px;color:#abc9ff;border-left:2px solid #77a8ff;padding:8px 15px;margin:20px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;border-block:1px solid var(--line);padding:22px 0;margin-top:28px}.stat strong{display:block;font-size:54px;line-height:1.2;font-weight:400}.stat span{font-size:12px;color:var(--muted)}.overview{display:grid;grid-template-columns:1fr 1fr;gap:60px}.overview h3{font-size:30px}.overview li,.overview p{color:#afbdd4}li{margin:12px 0}ul{padding-left:22px}.checks h3{display:flex;justify-content:space-between}.checks h3 span{font-size:12px;color:var(--muted)}.check{border-top:1px solid var(--line);padding:18px 0}summary{cursor:pointer;display:grid;grid-template-columns:80px 1fr auto;gap:20px;align-items:center}.check-id{font-size:11px;color:#7f9ac8}.check-name{font-size:24px}.check-name small{display:block;font-size:12px;color:var(--muted)}.check-body{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:25px;font-size:16px}.check-body p{margin:10px 0;overflow-wrap:anywhere}.evidence{grid-column:1/-1;border-top:1px solid var(--line);padding-top:16px}.evidence li{overflow-wrap:anywhere}.limits{border-left:2px solid #699dff;padding-left:35px}.limits-head p{color:var(--muted)}.handoff{margin-top:35px}.protocol{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:40px}.protocol b{font-weight:500;font-size:21px}.protocol p{font-size:14px}.end-title{font-size:70px;line-height:1.1;letter-spacing:-3px}.journey-nav,.telemetry{display:none}.action{display:inline-flex;border:1px solid #b8d0ff65;background:#e2edff;color:#091327;border-radius:30px;padding:12px 24px;text-decoration:none;margin-top:15px;font-size:14px}.station-label{color:#83aaff;letter-spacing:2px;font-size:12px;margin-bottom:25px}.reading .chrome{background:#050915}.reading .hero-intro{min-height:65vh}.reading .flat-node{margin:70px 0}.reading .station{display:block!important;opacity:1!important;visibility:visible!important;transform:none!important;position:static!important;width:auto!important}.reading .view{display:none!important}
body.spatial{height:var(--journey-height);overflow-x:hidden}.spatial .source{display:none}.spatial .view{display:block;position:fixed;inset:0;perspective:1100px;perspective-origin:50% 50%;overflow:hidden;background:radial-gradient(ellipse at 50% 52%,#17284c70,transparent 55%),#050915}.world{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}.station{position:absolute;left:50%;top:50%;width:1120px;transform-style:preserve-3d;backface-visibility:visible;transform-origin:center center;will-change:transform,opacity}.station-inner{position:relative;padding:32px 45px;border:1px solid #8ba9e524;border-radius:3px;background:linear-gradient(130deg,#0c1527f5,#080e1bf8);box-shadow:0 0 100px #2b68dc12}.station.hero-node{width:1280px;height:650px}.hero-node .station-inner{transform-style:preserve-3d;height:100%;border:0;background:none;box-shadow:none;padding:0}.hero-text{position:absolute;left:30px;top:150px;z-index:3;transform:translateZ(100px)}.hero-text h1{font-size:88px;margin:22px 0;letter-spacing:-6px;font-weight:500}.hero-text h1 span{display:block}.hero-text p{font-size:17px;line-height:1.8}.hero-text .station-label{letter-spacing:1px}.hero-word{position:absolute;left:30px;bottom:35px;font-size:16px;color:#8397bd;letter-spacing:1px}.monument{position:absolute;width:400px;height:420px;right:95px;top:90px;transform-style:preserve-3d;transform:rotateX(-16deg) rotateY(-28deg) rotateZ(8deg)}.h-layer{position:absolute;inset:0;clip-path:polygon(0 0,27% 0,27% 37%,73% 37%,73% 0,100% 0,100% 100%,73% 100%,73% 63%,27% 63%,27% 100%,0 100%);background:linear-gradient(120deg,#486295,#111a31 50%,#6494d4);transform:translateZ(var(--z))}.h-layer.front{background:linear-gradient(125deg,#f4faff 0%,#bfd0eb 20%,#536b98 38%,#e3f1ff 44%,#7f9dc9 62%,#eef7ff 80%,#7188b5 100%)}.ring{position:absolute;width:650px;height:650px;border:1px solid #83adff80;border-radius:50%;right:-30px;top:-20px;transform:rotateX(65deg) rotateZ(-28deg);box-shadow:0 0 16px #286aff44,inset 0 0 10px #286aff22}.ring.second{transform:rotateY(68deg) rotateX(10deg);border-color:#4979d950}.shaft{position:absolute;width:2px;height:760px;right:280px;top:-45px;background:linear-gradient(transparent,#b8d8ff,transparent);transform:rotate(46deg) translateZ(150px);box-shadow:0 0 18px #7dafff}.portal{position:absolute;left:50%;top:50%;width:1600px;height:1000px;border:1px solid #6d9cff26;box-shadow:0 0 70px #2459bd0b;pointer-events:none;transform-style:preserve-3d}.portal:before,.portal:after{content:'';position:absolute;top:0;bottom:0;width:2px;background:linear-gradient(transparent,#5790f690,transparent)}.portal:before{left:0}.portal:after{right:0}.depth-line{position:absolute;width:1px;height:16000px;background:linear-gradient(#91bfff60,transparent);left:50%;top:50%;transform-origin:top;transform:translateX(var(--x)) translateY(470px) rotateX(-90deg);pointer-events:none}.spatial .journey-nav{display:flex;position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:20;flex-direction:column;gap:14px}.journey-nav button{background:none;border:0;padding:5px;display:flex;align-items:center;justify-content:flex-end;gap:12px;font-size:10px;color:#91a6ca}.journey-nav i{height:5px;width:5px;border-radius:50%;background:#51627e}.journey-nav button[aria-current=true] i{background:#c7dfff;box-shadow:0 0 12px #81aaff}.journey-nav button[aria-current=true]{color:#edf4ff}.spatial .telemetry{display:flex;position:fixed;bottom:25px;left:4%;right:4%;z-index:20;justify-content:space-between;align-items:center;pointer-events:none;font-size:11px;color:#92a7cc;letter-spacing:1px}.depth-track{height:1px;width:160px;background:#ffffff25;display:inline-block;margin-left:16px;vertical-align:middle}.depth-track span{height:1px;background:#c5dcff;display:block;width:0}.lens{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px #0006;z-index:4}.station-number{position:absolute;left:-25px;top:-62px;color:#35537c;font-size:92px;font-weight:300;line-height:1;transform:translateZ(-80px)}
@media(max-width:700px){.chrome{height:65px}.chrome nav>span{display:none}.chrome nav{gap:10px}.brand{font-size:12px}.brand b{margin-right:5px}.journey-nav button span{display:none}.spatial .journey-nav{right:8px}.telemetry{font-size:9px!important}.depth-track{width:60px}.plain-report{padding:22px}.reading h1{font-size:50px}.reading h2{font-size:34px}.reading .overview,.reading .check-body,.reading .protocol{grid-template-columns:1fr}.reading summary{grid-template-columns:1fr auto}.reading .check-id{display:none}.reading .hero-intro{padding:22px}}
@media print{body{height:auto!important;background:white;color:black}.chrome,.view,.journey-nav,.telemetry,.hero-intro{display:none!important}.source{display:block!important}.plain-report{max-width:none;margin:0;padding:0}p,li,.meta,.status{color:#333!important}.flat-node{margin:30px 0}details{break-inside:avoid}.check-body{display:grid!important}.station-label{color:#333}}
</style></head><body class="reading"><header class="chrome"><a class="brand" href="#start"><b>H</b>CleanYourHarmony</a><nav><span>少一点打扰，多一点自由</span><button id="mode" type="button">空间浏览</button></nav></header>
<div class="view" aria-label="纵深报告空间"><div class="world"></div><div class="lens"></div></div><nav class="journey-nav" aria-label="报告章节"></nav><div class="telemetry"><span id="location">序章 / 回归清爽</span><span>下滑，向更深处 <span class="depth-track"><span id="progress"></span></span></span><span id="depth">Z / 00000</span></div>
<div class="source"><section class="hero-intro" id="start"><h1>让清爽，<br>回到你手中。</h1><p>CleanYourHarmony / 从改变，到可核验的答案。</p></section><main class="plain-report" id="report">@@REPORT@@</main><section class="plain-report" id="protocol"><h2 class="end-title">每一次改变，<br>都经得起回看。</h2><div class="protocol"><div><b>记录事实</b><p>以 JSON 记录范围、观察与证据，保留真实的未验证状态。</p></div><div><b>校验内容</b><p>检查结构、时间与状态一致性，修正错误再生成。</p></div><div><b>生成交付</b><p>用同一模板呈现结果，让结论与证据一起到达。</p></div></div><p>CleanYourHarmony · 统一验收模板 · 概念标识</p></section></div>
<script>
(()=>{
const body=document.body, world=document.querySelector('.world'),source=document.querySelector('.source'), report=document.querySelector('#report'), nav=document.querySelector('.journey-nav'),toggle=document.querySelector('#mode');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const groups=[],labels=[];
function group(label,nodes){const el=document.createElement('section');el.className='flat-node';el.dataset.label=label;nodes.forEach(n=>el.append(n));groups.push(el);labels.push(label);return el;}
const overview=report.querySelector('.overview'),checks=report.querySelector('.checks'),limits=report.querySelector('.limits'),next=report.querySelector('.handoff');
const overviewNodes=[...report.children].filter(n=>![overview,checks,limits,next].includes(n));
group('验收概览',overviewNodes);group('范围与环境',[overview]);
[...checks.querySelectorAll('.check')].forEach((check,i)=>{check.open=true;group('核验 '+(i+1),[check]);});
group('结论与下一步',[limits,next]);group('交付协议',[...document.querySelector('#protocol').children]);document.querySelector('#protocol').remove();report.replaceChildren(...groups);
const hero=document.createElement('section');hero.className='station hero-node';hero.innerHTML='<div class="station-inner"><div class="hero-text"><div class="station-label">你的设备，应该听你的。</div><h1><span>让清爽，</span><span>回到你手中。</span></h1><p>把干扰留在身后。<br>向前，进入每一次改变的证据。</p><a class="action" href="#chapter-1">进入验收空间 ↘</a></div><div class="ring"></div><div class="ring second"></div><div class="monument" role="img" aria-label="立体金属 H 项目标识"></div><div class="shaft"></div><div class="hero-word">CleanYourHarmony</div></div>';
for(let i=0;i<=32;i++){const layer=document.createElement('div');layer.className='h-layer'+(i===32?' front':'');layer.style.setProperty('--z',i*2+'px');hero.querySelector('.monument').append(layer);}
const stations=[hero];world.append(hero);
groups.forEach((g,i)=>{const station=document.createElement('section');station.className='station';station.id='chapter-'+(i+1);const inner=document.createElement('div');inner.className='station-inner';inner.innerHTML='<div class="station-number">'+String(i+1).padStart(2,'0')+'</div><div class="station-label">'+labels[i]+'</div>';const copy=g.cloneNode(true);copy.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));inner.append(copy);station.append(inner);world.append(station);stations.push(station);});
const names=['序章',...labels];names.forEach((name,i)=>{const button=document.createElement('button');button.innerHTML='<span>'+name+'</span><i></i>';button.setAttribute('aria-label','前往'+name);button.addEventListener('click',()=>go(i));nav.append(button);});
const spacing=1900, portals=[];
for(let i=0;i<stations.length*3;i++){const p=document.createElement('div');p.className='portal';p.setAttribute('aria-hidden','true');p.style.transform='translate(-50%,-50%) translateZ('+(-i*spacing/3-300)+'px)';world.prepend(p);portals.push(p);}
for(const x of [-650,-325,0,325,650]){const l=document.createElement('div');l.className='depth-line';l.style.setProperty('--x',x+'px');world.prepend(l);}
let spatial=false,queued=false,scales=[];
function fit(){scales=stations.map((s,i)=>Math.min(1,(innerWidth-150)/(i?1120:1280),(innerHeight-200)/Math.max(i?s.scrollHeight:650,1)));body.style.setProperty('--journey-height',((stations.length-1)*innerHeight*1.6+innerHeight)+'px');draw();}
function draw(){queued=false;if(!spatial)return;const step=scrollY/(innerHeight*1.6),z=Math.min(stations.length-1,Math.max(0,step))*spacing;world.style.transform='translateZ('+z+'px)';let active=Math.round(z/spacing);stations.forEach((s,i)=>{const delta=i*spacing-z;const fade=delta<0?Math.max(0,1+delta/650):Math.max(.04,1-delta/5500);const sideways=i===0?0:(i%2?120:-120)*Math.min(1,Math.abs(delta)/1900);s.style.transform='translate(-50%,-50%) translate3d('+sideways+'px,0,'+(-i*spacing)+'px) scale('+scales[i]+')';s.style.opacity=fade;s.style.visibility=delta< -680||delta>5700?'hidden':'visible';s.inert=i!==active;s.setAttribute('aria-hidden',String(i!==active));});portals.forEach((p,i)=>{const d=i*spacing/3+300-z;p.style.visibility=d< -1000||d>7000?'hidden':'visible';});[...nav.children].forEach((n,i)=>n.setAttribute('aria-current',String(i===active)));document.querySelector('#location').textContent=names[active];document.querySelector('#depth').textContent='Z / '+String(Math.round(z)).padStart(5,'0');document.querySelector('#progress').style.width=(z/((stations.length-1)*spacing)*100)+'%';}
function go(i){if(spatial)scrollTo({top:i*innerHeight*1.6,behavior:reduced.matches?'instant':'smooth'});else (i?groups[i-1]:document.querySelector('#start')).scrollIntoView();}
function setMode(value){spatial=value;body.className=value?'spatial':'reading';toggle.textContent=value?'平面阅读':'空间浏览';source.inert=value;source.setAttribute('aria-hidden',String(value));world.inert=!value;scrollTo(0,0);if(value)fit();}
toggle.addEventListener('click',()=>setMode(!spatial));document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();go(0);});hero.querySelector('a').addEventListener('click',e=>{e.preventDefault();go(1);});addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(draw);}},{passive:true});addEventListener('resize',fit);world.addEventListener('toggle',fit,true);reduced.addEventListener('change',()=>setMode(!reduced.matches));setMode(!reduced.matches);
})();
</script></body></html>
