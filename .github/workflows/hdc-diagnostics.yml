name: HDC Windows diagnostics
on:
  push:
    branches: [desktop-app]
    paths: ['.github/workflows/hdc-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: build/runtime
          key: bundled-runtime-win32-x64-${{ hashFiles('packaging/runtime-lock.json', 'packaging/prepare*-runtime.mjs') }}
      - if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: node packaging/prepare-official-runtime.mjs win32-x64
      - name: Inspect exact client output without building the app
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import os from 'node:os';import path from 'node:path';import {spawnSync} from 'node:child_process';
          import {HdcService} from './core/hdc-service.mjs';
          const dir=fs.mkdtempSync(path.join(os.tmpdir(),'cyh 安装诊断 '));fs.cpSync('build/runtime/win32-x64',dir,{recursive:true});
          const hdc=path.join(dir,'hdc.exe');const service=new HdcService(hdc,{log:s=>console.log('SERVER',s)});
          try {
            const client=await service.start();console.log('CLIENT',client);
            for(const args of [client.args,['-p','-s','127.0.0.1:8710'],['-p'],[]]) {
              const r=spawnSync(hdc,[...args,'list','targets','-v'],{cwd:dir,encoding:'utf8',timeout:10000});
              console.log(JSON.stringify({args,status:r.status,error:r.error?.message,stdout:r.stdout,stderr:r.stderr}));
            }
          }finally{await service.stop();}
          JS
