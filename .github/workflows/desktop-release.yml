name: Publish tested desktop packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Desktop packages run ID
        required: true
        type: string
      tag:
        description: Existing release tag matching the tested build commit
        required: true
        default: v1.1
        type: string
      macos_only:
        description: Replace only Mac packages and corresponding source/checksums
        type: boolean
        default: false
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
      MACOS_ONLY: ${{ inputs.macos_only }}
    steps:
      - name: Verify run and transfer tested assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          gh run view "$BUILD_RUN" --json status,conclusion,workflowName,headSha > run.json
          jq -e '.status == "completed" and .conclusion == "success" and .workflowName == "Desktop packages"' run.json
          gh run download "$BUILD_RUN" --name package-darwin-arm64 --name package-darwin-x64 --dir artifacts
          mkdir release
          version="${RELEASE_TAG#v}"
          cp "artifacts/package-darwin-arm64/cleanYourHarmony-$version-macos-arm64.dmg" release/
          cp "artifacts/package-darwin-x64/cleanYourHarmony-$version-macos-x64.dmg" release/
          if [[ "$MACOS_ONLY" == 'true' ]]; then
            gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt --pattern "cleanYourHarmony-$version-windows-x64-Setup.exe" --dir release
            (cd release && grep "  cleanYourHarmony-$version-windows-x64-Setup.exe$" SHA256SUMS.txt | sha256sum --check)
            sha=$(jq -r .headSha run.json)
            gh api "repos/$GH_REPO/tarball/$sha" > "release/cleanYourHarmony-$version-source.tar.gz"
            tar -tzf "release/cleanYourHarmony-$version-source.tar.gz" > /dev/null
            (cd release && sha256sum "cleanYourHarmony-$version-macos-arm64.dmg" "cleanYourHarmony-$version-macos-x64.dmg" "cleanYourHarmony-$version-windows-x64-Setup.exe" "cleanYourHarmony-$version-source.tar.gz" > SHA256SUMS.txt)
          else
            gh run download "$BUILD_RUN" --name package-win32-x64 --dir windows-artifact
            cp "windows-artifact/cleanYourHarmony-$version-windows-x64-Setup.exe" release/
            sha=$(jq -r .headSha run.json)
            tag_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
            [[ "$sha" == "$tag_sha" ]]
            gh api "repos/$GH_REPO/tarball/$sha" > "release/cleanYourHarmony-$version-source.tar.gz"
            tar -tzf "release/cleanYourHarmony-$version-source.tar.gz" > /dev/null
            (cd release && sha256sum "cleanYourHarmony-$version-macos-arm64.dmg" "cleanYourHarmony-$version-macos-x64.dmg" "cleanYourHarmony-$version-windows-x64-Setup.exe" "cleanYourHarmony-$version-source.tar.gz" > SHA256SUMS.txt)
          fi
          cd release
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [[ "$MACOS_ONLY" == 'true' ]]; then
            gh release upload "$RELEASE_TAG" "cleanYourHarmony-$version-macos-arm64.dmg" "cleanYourHarmony-$version-macos-x64.dmg" "cleanYourHarmony-$version-source.tar.gz" SHA256SUMS.txt --clobber
          else
            gh release upload "$RELEASE_TAG" "cleanYourHarmony-$version-macos-arm64.dmg" "cleanYourHarmony-$version-macos-x64.dmg" "cleanYourHarmony-$version-windows-x64-Setup.exe" "cleanYourHarmony-$version-source.tar.gz" SHA256SUMS.txt --clobber
          fi
          gh release view "$RELEASE_TAG" --json assets > published.json
          jq -e '[.assets[] | select(.state != "uploaded")] | length == 0' published.json
