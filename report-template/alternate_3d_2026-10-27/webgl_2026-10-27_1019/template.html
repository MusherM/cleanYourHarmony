<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title><style>
:root{color-scheme:dark;--ink:#eef4ff;--muted:#a2b4cf;--line:#2a3b55}*{box-sizing:border-box}body{margin:0;background:#060b17;color:var(--ink);font:16px/1.7 'Avenir Next','PingFang SC',sans-serif}button,a{color:inherit;font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #99c5ff;outline-offset:5px}.top{position:fixed;inset:0 0 auto;height:82px;padding:0 4%;display:flex;align-items:center;justify-content:space-between;z-index:5;background:linear-gradient(#060b17df,transparent)}.top button{border:1px solid #7793ba60;background:#07101e70;padding:8px 18px;border-radius:30px;font-size:12px}#home{font-size:17px;letter-spacing:-.4px;border:0;background:none;padding:0;font-weight:600}#home b{display:inline-block;border:1px solid #7992ba;margin-right:12px;padding:0 7px}#world{position:fixed;inset:0;display:none;outline:none}.webgl{height:var(--path-height)}.webgl #world{display:block}.webgl #flat{display:none}.hud{position:fixed;z-index:5;bottom:25px;left:4%;right:4%;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#a3bada;pointer-events:none}.track{width:140px;height:1px;background:#526681;display:inline-block;margin:0 15px;vertical-align:middle}.track span{display:block;background:#e4f1ff;height:1px;width:0}#chapters{position:fixed;right:24px;top:50%;transform:translateY(-50%);max-height:65vh;overflow:auto;display:flex;flex-direction:column;gap:7px;z-index:5;scrollbar-width:thin}#chapters button{border:0;background:transparent;color:#7592b9;font-size:10px;padding:5px 9px}#chapters button[aria-current=true]{color:white;border-right:2px solid #9ecaff}.reading .hud,.reading #chapters{display:none}#load-status{position:fixed;bottom:15px;left:4%;z-index:6;color:#e7be82;font-size:12px}#flat{max-width:1120px;margin:140px auto 80px;padding:30px}#flat>h1{font-size:64px;line-height:1.1;letter-spacing:-3px;margin-bottom:80px}h2{font-size:42px;line-height:1.2}h3{font-size:25px}p,li{color:var(--muted)}.section-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:20px 0}.meta{font-size:12px;overflow-wrap:anywhere}.demo{border-left:2px solid #8ebaff;padding:12px 20px;margin:22px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);padding:25px 0;margin:35px 0}.stat strong{display:block;font-size:52px;font-weight:400}.stat span{font-size:13px}.overview{display:grid;grid-template-columns:1fr 1fr;gap:50px}.check{padding:25px 0;border-top:1px solid var(--line)}summary{display:grid;grid-template-columns:80px 1fr auto;gap:15px;cursor:pointer}.check-id{font-size:12px}.check-name{font-size:22px}.check-name small{display:block;font-size:12px;color:var(--muted)}.check-body{display:grid;grid-template-columns:1fr 1fr;gap:25px;padding-top:25px}.evidence{grid-column:1/-1;overflow-wrap:anywhere}.limits{margin-top:50px;padding:20px 30px;border:1px solid var(--line)}.checks h3 span{font-size:12px;margin-left:25px}.handoff{margin-top:40px}li{margin:12px 0}@media(max-width:700px){.top{height:65px}#home{font-size:12px}.hud{font-size:9px}.track{width:40px}#chapters{right:7px}#flat{padding:20px}.overview,.check-body{grid-template-columns:1fr}summary{grid-template-columns:1fr auto}.check-id{display:none}#flat>h1{font-size:40px}}@media print{body{height:auto!important;background:white;color:black}.top,#world,.hud,#chapters,#load-status{display:none!important}#flat{display:block!important;margin:0;max-width:none}#flat>h1{display:none}p,li{color:#333}.check-body{display:grid!important}details{break-inside:avoid}}
</style></head><body class="reading"><header class="top"><button id="home"><b>H</b>CleanYourHarmony</button><button id="mode">进入 3D 世界</button></header><canvas id="world" aria-label="Three.js 三维展览空间：滚动推进相机，使用章节导航定位；文字报告可切换为平面阅读"></canvas><nav id="chapters" aria-label="三维展览章节"></nav><div class="hud"><span id="position">序章</span><span>滚动，走进清爽的世界 <span class="track"><span id="progress"></span></span></span><span id="depth">深度 0 m</span></div><p id="load-status" role="status"></p><main id="flat"><h1>CleanYourHarmony<br>让清爽，回到你手中。</h1><article id="report">@@REPORT@@</article></main><script>document.querySelectorAll('details').forEach(d=>d.open=true);</script><script>@@SCENE@@</script></body></html>
